<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>声堤 · 核心原理动画（原理示意）</title>
<style>
  /* ---- 想改字体就动这一段 ----
     --fs      全局字号倍数，1 = 现在这样。1.15 大约大一号，1.3 明显更大
     --fwb     标题类文字的粗细（600 是半粗，700 更粗，400 是常规）
     --font    换字体；逗号后面是"找不到时的备用字体"，按顺序找
     改完保存，浏览器按 F5。字变大可能挤在一起，撞车了告诉我挪位置。 */
  :root{
    --fs: 1.3;
    --fwb: 800;
    --font: "Microsoft YaHei","PingFang SC","Noto Sans SC",sans-serif;
  }
  html,body{margin:0;padding:0;background:#f6f7f9;overflow:hidden}
  svg{display:block;width:100vw;height:100vh;font-family:var(--font)}
  .lbl{font-size:calc(26px * var(--fs));fill:#5b6672}
  .big{font-size:calc(34px * var(--fs));fill:#1f2933;font-weight:var(--fwb)}
  .small{font-size:calc(21px * var(--fs));fill:#8b95a1}
  .k{font-size:calc(23px * var(--fs));fill:#1f2933}
</style>
</head>
<body>
<svg id="stage" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
    </marker>
    <linearGradient id="gVoice" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2f7ed8" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2f7ed8" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="gFb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8833a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#e8833a" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <!-- 标题条 -->
  <g id="head">
    <text x="80" y="86" class="big" id="title">声堤 · 反馈抵消原理</text>
    <text x="1840" y="86" text-anchor="end" class="small" fill="#b0723a">原理示意（非实测波形）</text>
    <line x1="80" y1="108" x2="1840" y2="108" stroke="#dfe3e8" stroke-width="2"/>
  </g>

  <!-- 场景
       坐标约定（改位置就看这里）：
         四个图形的基准点 = <g transform="translate(X,Y)">
         水平连线统一走 y=330，箭头尖端落在目标图形边缘外 4px
         麦克风话筒头 508–612 × 268–372，支架底 438
         处理器框     770–1150 × 228–408
         扬声器框     1350–1490 × 234–406
  -->
  <g id="scene" transform="translate(0,30)">
    <!-- 说话的人 -->
    <g id="person" transform="translate(180,320)">
      <circle cx="0" cy="-14" r="34" fill="#cfd6de"/>
      <path d="M-46,72 C-46,30 -18,12 0,12 C18,12 46,30 46,72 Z" fill="#cfd6de"/>
      <text x="0" y="122" text-anchor="middle" class="lbl">讲话者</text>
    </g>

    <!-- 麦克风 -->
    <g id="mic" transform="translate(560,320)">
      <rect x="-26" y="-52" width="52" height="104" rx="26" fill="#1f2933"/>
      <path d="M-44,10 L-44,30 A44,44 0 0,0 44,30 L44,10" fill="none" stroke="#1f2933" stroke-width="7" stroke-linecap="round"/>
      <line x1="0" y1="74" x2="0" y2="118" stroke="#1f2933" stroke-width="7" stroke-linecap="round"/>
      <text x="-34" y="196" text-anchor="end" class="lbl">麦克风</text>
    </g>

    <!-- 处理器 -->
    <g id="proc" transform="translate(960,320)">
      <rect x="-190" y="-92" width="380" height="180" rx="16" fill="#ffffff" stroke="#c9d1da" stroke-width="3"/>
      <text x="0" y="-50" text-anchor="middle" class="k" font-weight="600">反馈预测与相减</text>
      <text x="0" y="-6" text-anchor="middle" class="small" id="procA">用实际播放信号 u[n] 预测回传</text>
      <text x="0" y="34" text-anchor="middle" class="small" id="procB">麦克风信号 − 预测 = 残差</text>
      <text x="0" y="126" text-anchor="middle" class="lbl">FPGA（PL 侧）</text>
    </g>

    <!-- 扬声器 -->
    <g id="spk" transform="translate(1420,320)">
      <rect x="-70" y="-86" width="140" height="172" rx="12" fill="#e6ebf0" stroke="#c9d1da" stroke-width="3"/>
      <circle cx="0" cy="-32" r="30" fill="#1f2933" opacity="0.85"/>
      <circle cx="0" cy="56" r="20" fill="#1f2933" opacity="0.55"/>
      <text x="0" y="126" text-anchor="middle" class="lbl">扬声器</text>
    </g>

    <!-- 人 → 麦：有用语音（终点贴话筒头左缘 508） -->
    <path id="voicePath" d="M222,330 L504,330" fill="none"
          stroke="#2f7ed8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text id="voiceLbl" x="368" y="296" transform="translate(-15,2)" text-anchor="middle" class="lbl" fill="#2f7ed8">有用语音</text>

    <!-- 麦 → 处理器（起点贴话筒头右缘 612，终点贴框左缘 770） -->
    <path id="micToProc" transform="translate(-3,0)" d="M616,330 L766,330" fill="none"
          stroke="#2f7ed8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text id="micToProcLbl" x="692" y="296" text-anchor="middle" class="small">麦克风信号</text>

    <!-- 处理器 → 扬声器（起点贴框右缘 1150，终点贴扬声器左缘 1350） -->
    <path id="procToSpk" d="M1154,330 L1346,330" fill="none"
          stroke="#2f7ed8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text id="outLbl" x="1250" y="296" text-anchor="middle" class="small">输出</text>

    <!-- 回传弧。d 的读法：M 起点  C 控制点1 控制点2 终点（坐标是 1920×1080 画布上的像素）
         M 1470,406  起点：扬声器右下角外侧
         C 1560,640  控制点1：决定"从起点往哪个方向出发"，往右下甩
           560,700   控制点2：决定"从哪个方向进终点"，这里是正下方，所以最后垂直上升
           560,444   终点：麦克风支架底端，箭头朝上
         想改弯度就改这两个控制点；想让起终点换个位置就改 M 和最后一个点。 -->
    <path id="fbPath" d="M1470,406 C1560,640 560,700 560,444" fill="none"
          stroke="#e8833a" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 14"/>
    <text id="fbLbl" x="960" y="742" transform="translate(0,-60)" text-anchor="middle" class="lbl" fill="#c96a1e">扬声器声音回传到麦克风 = 反馈</text>

    <!-- 预测支路，同样是 M 起点 + C 两个控制点 + 终点
         M 1420,232  从扬声器上方出发
         C 1330,152 / 1120,140  往左上拱
         1052,224    落在处理器框顶部，箭头向下 -->
    <path id="predPath" d="M1420,232 C1330,152 1120,140 1052,224" fill="none"
          stroke="#2e9e6b" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text id="predLbl" x="1258" y="145" text-anchor="middle" class="lbl" fill="#237a52">预测回传分量</text>

    <!-- 相减符号（处理器框内已用文字表达，这里不再单独画，避免压住文字） -->

  </g>

  <!-- 信号说明条 -->
  <g id="signals">
    <g id="rowMic" transform="translate(170,860)">
      <text x="-92" y="8" class="lbl">麦克风</text>
      <rect x="20" y="-26" width="560" height="52" rx="8" fill="#eef2f6"/>
      <rect id="barMicFb" x="20" y="-26" width="0" height="52" fill="#e8833a" opacity="0.55" rx="8"/>
      <rect id="barMicV" transform="translate(20,0)" x="20" y="-26" width="0" height="52" fill="#2f7ed8" opacity="0.65" rx="8"/>
    </g>
    <g id="legendMic" transform="translate(190,908)" opacity="0">
      <rect x="0" y="-11" width="20" height="20" fill="#e8833a" opacity="0.55" rx="3"/>
      <text x="40" y="5" class="small">回传分量（被减掉）</text>
      <rect x="270" y="-11" width="20" height="20" fill="#2f7ed8" opacity="0.65" rx="3"/>
      <text x="300" y="5" class="small">有用语音（保留）</text>
    </g>
    <g id="rowPred" transform="translate(190,971)">
      <text x="-92" y="8" class="lbl">预测</text>
      <rect x="0" y="-26" width="560" height="52" rx="8" fill="#eef2f6"/>
      <rect id="barPred" x="0" y="-26" width="0" height="52" fill="#2e9e6b" opacity="0.7" rx="8"/>
    </g>
    <g id="rowRes" transform="translate(990,860)">
      <text x="-92" y="8" class="lbl">残差</text>
      <rect x="0" y="-26" width="560" height="52" rx="8" fill="#eef2f6"/>
      <rect id="barResV" x="0" y="-26" width="0" height="52" fill="#2f7ed8" opacity="0.65" rx="8"/>
    </g>
    <text id="note" x="1000" y="988" class="small" opacity="0">残差里留下的是语音，回传分量被减掉</text>
  </g>

  <!-- 结束卡 -->
  <g id="endcard" opacity="0">
    <rect x="0" y="0" width="1920" height="1080" fill="#f6f7f9"/>
    <text x="960" y="470" text-anchor="middle" font-size="58" font-weight="700" fill="#1f2933">抵消的是回传分量</text>
    <text x="960" y="560" text-anchor="middle" font-size="40" fill="#4a5560">不是把有用语音一起调小</text>
    <text x="960" y="668" text-anchor="middle" class="lbl">原理示意 · 非实测波形</text>
  </g>
</svg>

<script>
const DUR = 33.0;
function clamp01(x){ return x < 0 ? 0 : x > 1 ? 1 : x; }
function ramp(t, a, b){ return clamp01((t - a) / (b - a)); }
function ease(x){ return x * x * (3 - 2 * x); }
function set(id, opacity, extra){
  const el = document.getElementById(id);
  if (!el) return;
  el.setAttribute('opacity', opacity.toFixed(3));
  if (extra) for (const k in extra) el.setAttribute(k, extra[k]);
}

function render(t){
  // t 为秒；所有状态都由 t 唯一决定，便于逐帧截图
  const head = ramp(t, 0, 0.6);
  set('head', head);

  // 场景整体
  set('scene', ramp(t, 0.4, 1.4));

  // 0.4–4：人物、麦克风、扬声器依次出现
  set('person', ramp(t, 0.6, 1.4));
  set('mic', ramp(t, 1.0, 1.8));
  set('spk', ramp(t, 1.4, 2.2));
  set('proc', ramp(t, 1.8, 2.6));

  // 4–9：有用语音 → 麦克风 → 处理器 → 扬声器
  const v = ease(ramp(t, 4.0, 6.0));
  set('voicePath', v, {'stroke-dasharray': (900 * v).toFixed(1) + ' 900'});
  set('voiceLbl', ramp(t, 4.2, 5.2));
  set('micToProc', ease(ramp(t, 5.4, 6.6)));
  set('micToProcLbl', ramp(t, 5.6, 6.6));
  set('procToSpk', ease(ramp(t, 6.6, 7.8)));
  set('outLbl', ramp(t, 6.8, 7.8));

  // 9–14：回传弧出现并流动
  const fb = ease(ramp(t, 9.0, 11.0));
  set('fbPath', fb);
  set('fbLbl', ramp(t, 9.6, 10.8));
  // 流动：虚线偏移随时间走
  const dashShift = -((t - 9.0) * 90) % 32;
  document.getElementById('fbPath').setAttribute('stroke-dashoffset', dashShift.toFixed(1));

  // 14–20：预测支路（用实际播放信号预测回传）
  const pr = ease(ramp(t, 14.0, 16.0));
  set('predPath', pr, {'stroke-dasharray': (700 * pr).toFixed(1) + ' 700'});
  set('predLbl', ramp(t, 14.4, 15.6));
  document.getElementById('procA').setAttribute('opacity', clamp01(ramp(t, 14.6, 15.8)).toFixed(2));
  document.getElementById('procB').setAttribute('opacity', clamp01(ramp(t, 19.2, 20.4)).toFixed(2));

  // 20–26：相减
  const bars = ease(ramp(t, 20.6, 22.4));

  // 信号条数值（示意尺度，不是实测）
  const fbPartW = 260, voicePartW = 260;
  const fbW = fbPartW * bars, vW = voicePartW * bars;
  document.getElementById('barMicFb').setAttribute('width', fbW.toFixed(1));
  const vBar = document.getElementById('barMicV');
  vBar.setAttribute('x', fbW.toFixed(1));
  vBar.setAttribute('width', vW.toFixed(1));
  document.getElementById('legendMic').setAttribute('opacity',
    clamp01(ramp(t, 22.2, 23.2)).toFixed(2));
  document.getElementById('barPred').setAttribute('width', (fbPartW * ease(ramp(t, 21.0, 22.6))).toFixed(1));
  document.getElementById('rowMic').setAttribute('opacity', clamp01(ramp(t, 20.4, 21.2)).toFixed(2));
  document.getElementById('rowPred').setAttribute('opacity', clamp01(ramp(t, 20.8, 21.6)).toFixed(2));
  document.getElementById('rowRes').setAttribute('opacity', clamp01(ramp(t, 23.0, 23.8)).toFixed(2));
  document.getElementById('barResV').setAttribute('width', (voicePartW * ease(ramp(t, 23.0, 24.4))).toFixed(1));
  document.getElementById('note').setAttribute('opacity', clamp01(ramp(t, 24.0, 25.2)).toFixed(2));

  // 26–31：闭环一轮，箭头再亮一次
  const loop = 0.55 + 0.45 * Math.abs(Math.sin((t - 26) * 2.2));
  if (t >= 26 && t < 31) {
    document.getElementById('fbPath').setAttribute('opacity', loop.toFixed(2));
    document.getElementById('predPath').setAttribute('opacity', loop.toFixed(2));
  } else if (t >= 9) {
    document.getElementById('fbPath').setAttribute('opacity', fb.toFixed(2));
    document.getElementById('predPath').setAttribute('opacity', pr.toFixed(2));
  }

  // 31–33：结束卡
  const e = ease(ramp(t, 31.0, 31.9));
  set('endcard', e);
  set('scene', (1 - e) * ramp(t, 0.4, 1.4));
  set('signals', (1 - e) * 1);
  set('head', (1 - e) * head);
}

/* ---------------- 手动微调模式：地址栏加 #edit ---------------- */
function svgPoint(evt){
  const svg = document.getElementById('stage');
  const pt = svg.createSVGPoint();
  pt.x = evt.clientX; pt.y = evt.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

function enableEdit(){
  render(25);

  const NAMES = {
    person: '讲话者', mic: '麦克风', proc: '处理器框', spk: '扬声器',
    voicePath: '箭头：人→麦', voiceLbl: '文字：有用语音',
    micToProc: '箭头：麦→框', micToProcLbl: '文字：麦克风信号',
    procToSpk: '箭头：框→喇叭', outLbl: '文字：输出',
    fbPath: '回传虚线弧', fbLbl: '文字：回传说明',
    predPath: '预测绿弧', predLbl: '文字：预测回传分量',
    rowMic: '信号条：麦克风', rowPred: '信号条：预测',
    rowRes: '信号条：残差', legendMic: '信号条图例'
  };

  const panel = document.createElement('div');
  panel.id = 'recalpanel';
  panel.style.cssText = 'position:fixed;right:16px;top:16px;width:380px;background:#fff;'
    + 'border:1px solid #c9d1da;border-radius:10px;padding:12px;z-index:99;'
    + 'font:13px/1.6 "Microsoft YaHei",sans-serif;box-shadow:0 4px 16px rgba(0,0,0,.14)';
  panel.innerHTML =
    '<b>微调元素位置</b>'
    + '<div style="color:#5b6672;font-size:12px;line-height:1.6;margin:4px 0 8px">'
    + '先在下拉框里选一个元素，然后用 <b>方向键</b> 挪：普通 1 像素，按住 <b>Shift</b> 每次 10 像素。<br>'
    + '鼠标拖也行，拖不动就用方向键，效果一样。</div>'
    + '<select id="sel" style="width:100%;padding:6px;font-size:13px"></select>'
    + '<div id="pos" style="margin-top:6px;font:12px monospace;color:#2f7ed8;min-height:18px"></div>'
    + '<textarea id="out" style="width:100%;height:150px;margin-top:8px;font:12px monospace;'
    + 'border:1px solid #dfe3e8;border-radius:6px;padding:6px"></textarea>'
    + '<button id="dump" style="margin-top:6px;padding:5px 12px;cursor:pointer">生成代码</button>'
    + '<button id="reset" style="margin-top:6px;margin-left:8px;padding:5px 12px;cursor:pointer">'
    + '撤销全部</button>';
  document.body.appendChild(panel);

  const dirty = new Set();
  const sel = document.getElementById('sel');
  const posBox = document.getElementById('pos');
  const movable = [...document.querySelectorAll('#scene [id], #signals [id]')]
    .filter(el => el.id && el.id !== 'scene' && el.id !== 'signals');
  movable.forEach(el => {
    const o = document.createElement('option');
    o.value = el.id;
    o.textContent = (NAMES[el.id] || el.id) + '  ·  ' + el.id;
    sel.appendChild(o);
  });

  let cur = movable[0] || null;

  function baseOf(el){
    if (el.dataset.base === undefined) el.dataset.base = el.getAttribute('transform') || '';
    return /translate\(\s*([-\d.]+)[,\s]+([-\d.]+)\s*\)/.exec(el.dataset.base) || null;
  }

  function paint(el){
    const m = baseOf(el);
    const bx = m ? parseFloat(m[1]) : 0, by = m ? parseFloat(m[2]) : 0;
    const ox = parseFloat(el.dataset.ox || '0'), oy = parseFloat(el.dataset.oy || '0');
    el.setAttribute('transform', `translate(${(bx + ox).toFixed(0)},${(by + oy).toFixed(0)})`);
    if (el === cur) {
      posBox.textContent = `${NAMES[el.id] || el.id}  →  translate(${(bx + ox).toFixed(0)},${(by + oy).toFixed(0)})`;
    }
  }

  function nudge(el, dx, dy){
    el.dataset.ox = (parseFloat(el.dataset.ox || '0') + dx).toFixed(0);
    el.dataset.oy = (parseFloat(el.dataset.oy || '0') + dy).toFixed(0);
    paint(el);
    dirty.add(el);
  }

  sel.onchange = () => {
    cur = movable.find(e => e.id === sel.value);
    paint(cur);
    sel.blur();
  };
  if (cur) { sel.value = cur.id; paint(cur); }

  // 方向键：不依赖任何鼠标事件，最稳的一条路
  document.addEventListener('keydown', e => {
    if (!cur || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA') return;
    const step = e.shiftKey ? 10 : 1;
    let dx = 0, dy = 0;
    if (e.key === 'ArrowLeft') dx = -step;
    else if (e.key === 'ArrowRight') dx = step;
    else if (e.key === 'ArrowUp') dy = -step;
    else if (e.key === 'ArrowDown') dy = step;
    else return;
    e.preventDefault();
    nudge(cur, dx, dy);
  });

  // 鼠标拖动：用 document 级 mousedown/mousemove，不依赖 pointer capture
  let dragFrom = null, dragOrigin = null;
  document.addEventListener('mousedown', e => {
    if (e.target.closest('#recalpanel')) return;
    const el = e.target.closest('#scene [id], #signals [id]');
    if (!el || el.id === 'scene' || el.id === 'signals') return;
    e.preventDefault();
    cur = el; sel.value = el.id;
    dragFrom = svgPoint(e);
    dragOrigin = [parseFloat(el.dataset.ox || '0'), parseFloat(el.dataset.oy || '0')];
    paint(el);
  });
  document.addEventListener('mousemove', e => {
    if (!dragFrom || !cur || !dragOrigin) return;
    const p = svgPoint(e);
    cur.dataset.ox = (dragOrigin[0] + p.x - dragFrom.x).toFixed(0);
    cur.dataset.oy = (dragOrigin[1] + p.y - dragFrom.y).toFixed(0);
    paint(cur);
    dirty.add(cur);
  });
  document.addEventListener('mouseup', () => { dragFrom = null; dragOrigin = null; });

  document.getElementById('dump').onclick = () => {
    const lines = movable.filter(el => dirty.has(el))
      .map(el => `${el.id}  ${el.getAttribute('transform') || 'translate(0,0)'}`);
    document.getElementById('out').value = lines.length ? lines.join('\n') : '还没挪过任何元素';
  };
  document.getElementById('reset').onclick = () => {
    movable.forEach(el => {
      el.dataset.ox = '0'; el.dataset.oy = '0';
      baseOf(el);
      paint(el);
    });
    dirty.clear();
    document.getElementById('out').value = '';
  };
}

// 截图模式：#t=12.5 渲染该时刻的静态帧；#edit 或 ?edit 进微调；无参数则循环播放。
// 改完地址栏如果画面没变，是浏览器只当成"页内跳转"没有重新加载——这里监听一次，自动刷新。
window.addEventListener('hashchange', () => location.reload());

function boot(){
  const q = (location.hash || '') + (location.search || '');
  if (/edit/.test(q)) { enableEdit(); return; }
  const m = /t=([\d.]+)/.exec(location.hash || '');
  if (m) {
    render(Math.min(DUR, parseFloat(m[1])));
    return;
  }
  const t0 = performance.now();
  function tick(now){
    const t = ((now - t0) / 1000) % DUR;
    render(t);
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
boot();
</script>
</body>
</html>
