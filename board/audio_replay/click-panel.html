<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>声堤 · 现场听音</title>
<style>
:root{--ink:#17324a;--paper:#edf3f8;--blue:#1766b3;--line:#cbd8e4;--alert:#9b3727}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:'Microsoft YaHei','PingFang SC',sans-serif}main{max-width:900px;margin:auto;padding:28px 20px}header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:14px}h1{font-family:'Microsoft JhengHei',sans-serif;font-size:26px;margin:0}header span{font-size:14px}.warning{color:var(--alert);margin:18px 0;line-height:1.6}.panel{background:white;padding:26px;border:1px solid var(--line);border-radius:8px;margin:14px 0}#task{font-size:15px;color:#486278}#prompt{font-size:23px;line-height:1.55;margin:15px 0 22px}label{display:block;line-height:1.6;margin:12px 0}input[type=checkbox]{width:20px;height:20px;vertical-align:middle;margin-right:10px;accent-color:var(--blue)}button{font:inherit;min-height:52px;padding:12px 20px;border:1px solid var(--line);border-radius:5px;background:white;color:var(--ink);cursor:pointer}button.primary{background:var(--blue);color:white;border-color:var(--blue)}button:disabled{opacity:.4;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #cb850c;outline-offset:3px}#answers{display:flex;flex-wrap:wrap;gap:10px}.steps{display:grid;grid-template-columns:1fr 1fr;gap:12px}.steps button{text-align:left}.small{font-size:14px;line-height:1.6;color:#486278}#log{white-space:pre-wrap;overflow-wrap:anywhere;max-height:240px;overflow:auto;font-family:Consolas,monospace;font-size:12px}#error{color:var(--alert);white-space:pre-wrap}#levels{font-family:Consolas,monospace}footer{display:flex;justify-content:space-between;align-items:center;gap:12px}#stop{color:var(--alert)}@media(max-width:600px){.steps{grid-template-columns:1fr}main{padding:15px}#prompt{font-size:20px}header{display:block}#answers button{width:100%}}
</style></head><body><main>
<header><h1>声堤 / 现场听音</h1><span>板卡由 A 控制</span></header>
<p class="warning">持续尖叫 → 立即切断音响电源。页面按钮不能保证实时急停。</p>
<section class="panel" aria-live="polite"><div id="task">正在连接板卡…</div><div id="levels" class="small"></div><h2 id="prompt">等待状态</h2><div id="confirm"></div><div id="answers"></div><p id="error" role="alert"></p></section>
<section id="idle" class="panel"><div class="steps"><button id="record" onclick="record()"><b>1　准备录音</b><br><span class="small">先关闭音响电源，录一次2秒；已有录音复用</span></button><button id="run" class="primary" onclick="act('run')"><b>2　开始本批</b><br>手机停止外放，恢复音响供电</button></div><label id="record-confirm"><input id="poweroff" type="checkbox">音响电源已关闭，箱体与设备位置保持不变。</label><p class="small" id="ready-info"></p></section>
<footer><span class="small">每项自动限时，结束后点听感。</span><button id="stop" onclick="post('/stop',{})">停止后续项目</button></footer>
<details class="panel"><summary>运行记录（出错时保留页面，我来处理）</summary><pre id="log"></pre><div class="small" id="result"></div></details>
</main><script>
let current=null, shown='', sending=false;
const el=id=>document.getElementById(id);
async function post(path,data){if(sending)return; sending=true;try{let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});let j=await r.json();if(!r.ok)throw Error(j.error||'请求失败');el('error').textContent='';await refresh();}catch(e){el('error').textContent=e.message;}finally{sending=false;}}
function act(action){return post('/action',{action});}
function record(){return post('/action',{action:'record',confirmed:el('poweroff').checked});}
function answer(value){return post('/answer',{id:current.waiting.id,value,confirmed:!!el('onsite')?.checked});}
async function refresh(){try{let r=await fetch('/state');if(!r.ok)throw Error('连接失效，请由A重新打开现场链接。');current=await r.json();const s=current,w=s.waiting;el('task').textContent=s.task;el('levels').textContent=s.levels.length?'本批反馈增益：'+s.levels.join(' / ')+' dB':'';el('log').textContent=s.log.join('\n');el('result').textContent=s.summary_path?'结果保存在板卡：'+s.summary_path:'';el('stop').disabled=!s.busy;el('idle').hidden=s.busy;el('error').textContent=s.error||'';el('record').disabled=!!s.error||!s.plan_ready||!el('poweroff').checked;el('run').disabled=!!s.error||!s.plan_ready||!s.source_exists;el('ready-info').textContent=!s.plan_ready?'等待A完成静默选档；无需你调试。':s.source_exists?'已有录音，可直接开始本批。':'录音按钮先准备配置；之后会明确提示何时启动手机语音。';
if(w){if(shown!==w.id){shown=w.id;el('prompt').textContent=w.prompt;el('confirm').replaceChildren();el('answers').replaceChildren();if(w.confirm){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.id='onsite';l.append(c,document.createTextNode(w.confirm));el('confirm').append(l);c.onchange=()=>el('answers').querySelectorAll('button').forEach(b=>b.disabled=b.dataset.value!=='STOP'&&!c.checked);}
w.options.forEach(([v,t])=>{let b=document.createElement('button');b.textContent=t;b.dataset.value=v;b.className=(v==='1'||v==='START'||v==='READY'||v==='RECORD')?'primary':'';b.disabled=!!w.confirm&&v!=='STOP';b.onclick=()=>answer(v);el('answers').append(b);});}}
else{shown='';el('confirm').replaceChildren();el('answers').replaceChildren();el('prompt').textContent=s.error?'本步失败，A处理后再继续，无需重复点击。':s.busy?'正在执行，请等待本项结束…':s.result?'本批已结束，结果由A读取。':s.source_exists?'录音已保存：停手机、恢复音响供电，点击下方「2 开始本批」。':s.plan_ready?'选档已就绪，按下面两步操作。':'等待A准备';}
}catch(e){el('error').textContent=e.message;el('record').disabled=true;el('run').disabled=true;el('answers').querySelectorAll('button').forEach(b=>b.disabled=true);}}
el('poweroff').onchange=()=>{el('record').disabled=!!current?.error||!current?.plan_ready||!el('poweroff').checked;};setInterval(refresh,1000);refresh();
</script></body></html>
